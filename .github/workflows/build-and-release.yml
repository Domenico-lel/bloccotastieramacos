name: Build macOS apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Intel, Apple Silicon and Universal
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Build all versions
        run: |
          chmod +x build-intel.command build-apple-silicon.command build-universal.command
          ./build-intel.command
          ./build-apple-silicon.command
          ./build-universal.command

      - name: Verify architectures and signatures
        run: |
          intel_app="build/iBlock.app"
          arm_app="build-apple-silicon/iBlock.app"
          universal_app="build-universal/iBlock.app"

          lipo "$intel_app/Contents/MacOS/iBlock" -verify_arch x86_64
          lipo "$arm_app/Contents/MacOS/iBlock" -verify_arch arm64
          lipo "$universal_app/Contents/MacOS/iBlock" -verify_arch x86_64 arm64

          codesign --verify --deep --strict "$intel_app"
          codesign --verify --deep --strict "$arm_app"
          codesign --verify --deep --strict "$universal_app"

      - name: Upload Intel download
        uses: actions/upload-artifact@v4
        with:
          name: iBlock-Intel
          path: build/iBlock-Intel.zip

      - name: Upload Apple Silicon download
        uses: actions/upload-artifact@v4
        with:
          name: iBlock-Apple-Silicon
          path: build-apple-silicon/iBlock-Apple-Silicon.zip

      - name: Upload Universal download
        uses: actions/upload-artifact@v4
        with:
          name: iBlock-Universale
          path: build-universal/iBlock-Universale.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/iBlock-Intel.zip \
            build-apple-silicon/iBlock-Apple-Silicon.zip \
            build-universal/iBlock-Universale.zip \
            --title "iBlock $GITHUB_REF_NAME" \
            --generate-notes
